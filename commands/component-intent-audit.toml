description = "Audit repository health, declarations, usage, and component intent"
prompt = "Run component-intent-audit on the current repository. Use whole-repository health mode unless the user specifically asks for a diff audit. Prefer machine-readable output: component-intent-audit --health --json or component-intent-audit --diff --json. If the command is not on PATH, use a known local checkout with: node /absolute/path/to/component-intent-audit/dist/cli.js --health --json. Report repository intelligence coverage, findings, and intelligence signals only; do not apply fixes unless separately asked."
