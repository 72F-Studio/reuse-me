description = "Audit repository health, declarations, usage, and component intent"
prompt = "Run reuse-me on the current repository. Use whole-repository health mode unless the user specifically asks for a diff audit. Prefer machine-readable output: reuse-me --health --json or reuse-me --diff --json. If the command is not on PATH, use a known local checkout with: node /absolute/path/to/reuse-me/dist/cli.js --health --json. Report repository intelligence coverage, findings, and intelligence signals only; do not apply fixes unless separately asked."
